name: Seite bauen und veröffentlichen

on:
  push:
    branches: [main]
  # Täglicher Neubau kurz nach Mitternacht (deutsche Zeit), damit vorgeplante
  # Beiträge (Datum in der Zukunft) an ihrem Tag automatisch erscheinen.
  schedule:
    - cron: '7 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://sebutd.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/EintrachtBerssen' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/optimize-uploads.mjs
      - run: npm run build
      - run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
